id: feroxbuster
tool: feroxbuster
description: Fast recursive content discovery
# Lab note (Kali probe 2026-07-28): feroxbuster 2.13.1
min_version_note: "feroxbuster 2.x"
notes: "Quiet/silent defaults for action_log noise control."
params:
  target_keys: [url, target]
  required: [url]
  defaults:
    wordlist: /usr/share/wordlists/dirb/common.txt
    threads: 30
    depth: 2
command:
  template: "feroxbuster -u {url} -w {wordlist} -t {threads} -d {depth} -q --silent"
  extra_args_key: additional_args
cache_ttl: 3600
