id: sqlmap
tool: sqlmap
description: SQL injection detection with non-interactive batch mode
# Lab note (Kali probe 2026-07-28): sqlmap 1.9.8#stable (upstream may warn outdated)
min_version_note: "sqlmap 1.7+ with --batch"
notes: "level/risk stay low for harness lab; raise only with explicit additional_args."
params:
  target_keys: [url, target]
  required: [url]
  defaults:
    batch: true
    level: 1
    risk: 1
command:
  template: "sqlmap -u {url} --batch --level {level} --risk {risk}"
  extra_args_key: additional_args
cache_ttl: 600
