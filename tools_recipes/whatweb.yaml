id: whatweb
tool: whatweb
description: Web technology fingerprint
# Lab note (Kali probe 2026-07-28): WhatWeb 0.6.2
min_version_note: "whatweb 0.5+ (-a aggression)"
notes: "aggression=1 is fingerprint-light for harness recon."
params:
  target_keys: [target, url]
  required: [target]
  defaults:
    aggression: "1"
command:
  template: "whatweb -a {aggression} {target}"
  extra_args_key: additional_args
cache_ttl: 7200
